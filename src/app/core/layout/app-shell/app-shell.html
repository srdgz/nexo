<button type="button" class="skip-link" (click)="skipToContent()">
  {{ 'layout.skipToContent' | transloco }}
</button>

@if (mode() !== 'mobile') {
  <div class="sidebar-slot">
    <nx-sidebar
      [collapsed]="mode() === 'tablet' && !railOpen()"
      [user]="user()"
      [class.floating]="railOpen()"
      (navigated)="railOpen.set(false)"
    />
  </div>
  @if (railOpen()) {
    <button
      type="button"
      class="scrim"
      tabindex="-1"
      [attr.aria-label]="'layout.collapseMenu' | transloco"
      (click)="railOpen.set(false)"
    ></button>
  }
}

<div class="column">
  <nx-app-header [mode]="mode()" [railOpen]="railOpen()" (toggleRail)="railOpen.set(!railOpen())" />

  @if (session.mode === 'demo') {
    <nx-demo-banner [compact]="mode() === 'mobile'" />
  }

  @if (mode() === 'mobile' && section(); as section) {
    <nx-tab-nav class="section-tabs" [label]="section.labelKey | transloco">
      @for (item of section.items; track item.path) {
        <a nx-tab [routerLink]="item.path" routerLinkActive ariaCurrentWhenActive="page">
          {{ item.labelKey | transloco }}
        </a>
      }
    </nx-tab-nav>
  }

  <main #main id="main" class="content" tabindex="-1">
    <router-outlet />
  </main>
</div>

@if (mode() === 'mobile') {
  <nx-bottom-nav />
}
